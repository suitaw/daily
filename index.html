<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<title>每日速递</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📰</text></svg>">
<style>
:root{
  --bg:#f6f5f2; --card:#fff; --text:#1f1f1f; --sub:#6b6b6b; --line:#e6e4df;
  --accent:#2f6fde; --accent-bg:#e8f0fd;
  --hot-bg:#fff1e6; --hot-line:#f5c7a3;
  --explain-bg:#eaf6ee; --explain-line:#b9dfc5;
  --opinion-bg:#fdf6dd; --opinion-line:#ecd98f;
  --code-bg:#f1f0ec; --shadow:0 1px 3px rgba(0,0,0,.06);
  --me-bg:#2f6fde; --me-text:#fff; --on-accent:#fff; --err-bg:#fdecec; --err-line:#f0b4b4;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#16171a; --card:#202226; --text:#e8e8e6; --sub:#9a9a98; --line:#33353a;
    --accent:#7aa7f5; --accent-bg:#26324a;
    --hot-bg:#3a2a1e; --hot-line:#6b4a31;
    --explain-bg:#1f3327; --explain-line:#355a42;
    --opinion-bg:#37321c; --opinion-line:#6a5d2b;
    --code-bg:#15161a; --shadow:none;
    --me-bg:#34558f; --me-text:#f1f4fa; --on-accent:#0e1a30; --err-bg:#3a2224; --err-line:#6e3a3e;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);
  font:16px/1.75 -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}
a{color:var(--accent);text-decoration:none;word-break:break-all}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 90px}

header{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{max-width:760px;margin:0 auto;padding:10px 16px 0}
h1{font-size:20px;margin:0 0 8px;display:flex;align-items:center;gap:8px}
.tabs{display:flex;gap:4px}
.tab{flex:1;border:0;background:none;color:var(--sub);font-size:15px;padding:8px 0 10px;
  border-bottom:3px solid transparent;cursor:pointer}
.tab.on{color:var(--text);font-weight:600;border-bottom-color:var(--accent)}

.datebar{display:flex;align-items:center;gap:8px;margin:14px 0}
.datebar button{border:1px solid var(--line);background:var(--card);color:var(--text);
  border-radius:8px;height:36px;min-width:44px;font-size:15px;cursor:pointer}
.datebar button:disabled{opacity:.35;cursor:default}
.datebar select{flex:1;height:36px;border:1px solid var(--line);border-radius:8px;
  background:var(--card);color:var(--text);font-size:15px;padding:0 8px}

.box{border-radius:12px;padding:12px 14px;margin:12px 0;border:1px solid}
.hot{background:var(--hot-bg);border-color:var(--hot-line)}
.explain{background:var(--explain-bg);border-color:var(--explain-line)}
.opinion{background:var(--opinion-bg);border-color:var(--opinion-line)}
.box b.lead{display:block;margin-bottom:2px}

.toc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 0;margin:12px 0;box-shadow:var(--shadow)}
.toc a{display:flex;gap:8px;padding:8px 14px;color:var(--text);line-height:1.5}
.toc a:active{background:var(--accent-bg)}
.toc .n{color:var(--sub);min-width:1.4em}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:16px 0;
  box-shadow:var(--shadow);scroll-margin-top:120px}
.card h2{font-size:18px;line-height:1.5;margin:0 0 6px}
.meta{color:var(--sub);font-size:14px;margin-bottom:6px}
.meta code{font-size:13px}
.card p{margin:8px 0}
code{background:var(--code-bg);border-radius:4px;padding:1px 5px;font:14px/1.5 ui-monospace,Menlo,Consolas,monospace;overflow-wrap:anywhere}
.install{border-top:1px dashed var(--line);margin-top:12px;padding-top:8px}
.install h3{font-size:15px;margin:8px 0}
.step{margin:8px 0}
.code{position:relative;margin:6px 0}
pre{background:var(--code-bg);border-radius:8px;padding:10px 64px 10px 12px;margin:0;
  font:13.5px/1.55 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all}
.copy{position:absolute;top:6px;right:6px;border:1px solid var(--line);background:var(--card);
  color:var(--sub);font-size:12px;border-radius:6px;padding:2px 8px;cursor:pointer;font-family:inherit}
.sources{font-size:14px;color:var(--sub);margin-top:10px}
.sources a{margin-right:10px;display:inline-block}
.foot{color:var(--sub);font-size:13px;text-align:center;margin-top:24px}
.empty{color:var(--sub);text-align:center;padding:48px 0}
.top{position:fixed;right:18px;bottom:84px;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);
  background:var(--card);color:var(--text);font-size:18px;box-shadow:0 2px 8px rgba(0,0,0,.15);display:none;cursor:pointer}

/* ===== 问 AI ===== */
.askrow{display:flex;justify-content:flex-end;margin-top:10px}
.ask{border:1px solid var(--line);background:var(--accent-bg);color:var(--accent);border-radius:16px;
  padding:4px 12px;font-size:14px;cursor:pointer;font-family:inherit}
.aifab{position:fixed;right:16px;bottom:20px;z-index:20;height:48px;padding:0 16px;border-radius:24px;border:0;
  background:var(--accent);color:var(--on-accent);font-size:15px;font-weight:600;box-shadow:0 3px 10px rgba(0,0,0,.25);cursor:pointer;font-family:inherit}
body.ai-open{overflow:hidden}
.ai{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;justify-content:flex-end;background:rgba(0,0,0,.35)}
.ai.open{display:flex}
.sheet{width:100%;max-width:760px;margin:0 auto;height:94%;background:var(--bg);border-radius:16px 16px 0 0;
  display:flex;flex-direction:column;overflow:hidden;box-shadow:0 -4px 20px rgba(0,0,0,.2)}
.ai-head{display:flex;align-items:center;gap:6px;padding:10px 10px 6px 16px}
.ai-head b{font-size:17px}
.ai-model{flex:1;min-width:0;color:var(--sub);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  border:0;background:none;text-align:left;padding:0;cursor:pointer;font-family:inherit}
.ai-icon{border:0;background:none;color:var(--text);font-size:19px;width:38px;height:38px;border-radius:8px;cursor:pointer;flex:none}
.ai-icon:active{background:var(--accent-bg)}
.ai-scope{display:flex;gap:6px;padding:0 16px}
.ai-scope button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:8px;height:32px;
  font-size:14px;cursor:pointer;font-family:inherit}
.ai-scope button.on{border-color:var(--accent);color:var(--accent);background:var(--accent-bg);font-weight:600}
.ai-scope button:disabled{opacity:.4;cursor:default}
.ai-ctx{color:var(--sub);font-size:13px;padding:6px 16px 8px;border-bottom:1px solid var(--line);line-height:1.5}
.ai-list{flex:1;overflow-y:auto;padding:8px 14px 12px;overscroll-behavior:contain}
.msg{margin:12px 0}
.msg.me{display:flex;justify-content:flex-end}
.msg.me .bubble{background:var(--me-bg);color:var(--me-text);border-radius:14px 14px 4px 14px;padding:8px 12px;
  max-width:85%;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.bot{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 14px 8px}
.md{overflow-wrap:anywhere}
.md p{margin:8px 0}
.md h4{font-size:16px;margin:12px 0 4px}
.md ul,.md ol{margin:6px 0;padding-left:1.4em}
.md li{margin:3px 0}
.md li>p{margin:2px 0}
.md blockquote{margin:8px 0;padding:2px 12px;border-left:3px solid var(--line);color:var(--sub)}
.md hr{border:0;border-top:1px solid var(--line);margin:12px 0}
.md .tbl{overflow-x:auto;margin:8px 0}
.md table{border-collapse:collapse;font-size:14px;min-width:100%}
.md th,.md td{border:1px solid var(--line);padding:4px 8px;text-align:left;vertical-align:top}
.md th{background:var(--code-bg)}
.think{margin:8px 0 0;font-size:14px;color:var(--sub)}
.think summary{cursor:pointer}
.think div{white-space:pre-wrap;max-height:240px;overflow-y:auto;margin-top:4px;padding:6px 8px;background:var(--code-bg);border-radius:8px}
.cites{font-size:13px;margin:8px 0 2px;color:var(--sub)}
.cites a{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.err{background:var(--err-bg);border:1px solid var(--err-line);border-radius:8px;padding:6px 10px;margin:8px 0;font-size:14px}
.mfoot{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:6px;font-size:12px;color:var(--sub)}
.mfoot .mmeta{flex:1;min-width:0}
.mbtn{border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:6px;padding:1px 8px;font-size:12px;cursor:pointer;font-family:inherit}
.wait{color:var(--sub);font-size:14px;padding:8px 0}
.wait::after{content:'';animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}
.ai-empty{padding:8px 2px;color:var(--sub);font-size:14px}
.chips{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;padding:8px 12px;
  text-align:left;font-size:15px;cursor:pointer;font-family:inherit}
.chip:active{background:var(--accent-bg)}
.ai-input{display:flex;align-items:flex-end;gap:6px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--card)}
.ai-input textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);
  font:16px/1.5 inherit;font-family:inherit;padding:7px 10px;max-height:140px;min-height:40px}
.web{flex:none;height:40px;border:1px solid var(--line);background:var(--bg);color:var(--sub);border-radius:10px;padding:0 8px;font-size:14px;cursor:pointer;font-family:inherit}
.web.on{border-color:var(--accent);color:var(--accent);background:var(--accent-bg);font-weight:600}
.send{flex:none;height:40px;min-width:56px;border:0;border-radius:10px;background:var(--accent);color:var(--on-accent);font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
.send.stop{background:#c9453d;color:#fff}
.send:disabled{opacity:.45;cursor:default}
.ai-set{flex:1;overflow-y:auto;padding:4px 16px 24px}
.ai-set h3{font-size:16px;margin:18px 0 6px}
.ai-set p,.ai-set li{font-size:14px;color:var(--sub);margin:4px 0}
.ai-set ol{padding-left:1.3em;margin:4px 0}
.ai-set input,.ai-set textarea{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);
  font-size:15px;padding:8px 10px;font-family:inherit}
.ai-set textarea{min-height:84px;resize:vertical}
.row{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.row input{flex:1;min-width:0}
.btn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:8px;padding:6px 12px;font-size:14px;cursor:pointer;font-family:inherit}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.note{font-size:13px;color:var(--sub);margin-top:6px;min-height:1em}
.models{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.model{display:flex;justify-content:space-between;gap:8px;border:1px solid var(--line);background:var(--card);color:var(--text);
  border-radius:8px;padding:8px 10px;font-size:14px;text-align:left;cursor:pointer;font-family:inherit}
.model.on{border-color:var(--accent);background:var(--accent-bg)}
.model small{color:var(--sub);white-space:nowrap}
@media (min-width:800px){.sheet{height:88%;margin-bottom:4vh;border-radius:16px}}
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1><span id="icon">📰</span>每日速递</h1>
    <div class="tabs">
      <button class="tab" data-t="news">📰 AI 资讯</button>
      <button class="tab" data-t="github">🐙 GitHub 热门</button>
    </div>
  </div>
</header>
<main class="wrap">
  <div class="datebar">
    <button id="prev" aria-label="前一天">‹</button>
    <select id="dates" aria-label="选择日期"></select>
    <button id="next" aria-label="后一天">›</button>
  </div>
  <div id="view"><div class="empty">加载中…</div></div>
</main>
<button class="top" id="top" aria-label="回到顶部">↑</button>
<button class="aifab" id="aifab">🤖 问 AI</button>

<div class="ai" id="ai" aria-hidden="true">
  <div class="sheet" role="dialog" aria-label="问 AI">
    <div class="ai-head">
      <b>🤖 问 AI</b>
      <button class="ai-model" id="aiModel" title="换模型"></button>
      <button class="ai-icon" id="aiNew" aria-label="新对话" title="新对话">🗑️</button>
      <button class="ai-icon" id="aiSetBtn" aria-label="设置" title="设置">⚙️</button>
      <button class="ai-icon" id="aiClose" aria-label="关闭" title="关闭">✕</button>
    </div>
    <div id="aiChat" style="display:contents">
      <div class="ai-scope" id="aiScope">
        <button data-s="item">这一条</button>
        <button data-s="day">这一天</button>
        <button data-s="all">全部日期</button>
      </div>
      <div class="ai-ctx" id="aiCtx"></div>
      <div class="ai-list" id="aiList"></div>
      <div class="ai-input">
        <button class="web" id="aiWeb" title="允许 AI 联网搜索、读网页（每次搜索另收费）">🌐 联网</button>
        <textarea id="aiText" rows="1" placeholder="问问这些内容…"></textarea>
        <button class="send" id="aiSend">发送</button>
      </div>
    </div>
    <div class="ai-set" id="aiSet" style="display:none"></div>
  </div>
</div>

<script>
window.DAILY_INDEX = {};
window.DAILY_DATA = {};

const TYPES = {
  news:   { icon: '📰', name: 'AI 资讯' },
  github: { icon: '🐙', name: 'GitHub 热门' }
};
// GitHub Pages 缓存 10 分钟，索引按小时加版本号，避免早上更新了还看到旧列表
const VER = new Date().toISOString().slice(0, 13).replace(/\D/g, '');
let cur = { type: 'news', date: null };

function loadScript(src) {
  return new Promise((ok, fail) => {
    const s = document.createElement('script');
    s.src = src;
    s.onload = ok;
    s.onerror = () => fail(new Error('加载失败：' + src));
    document.head.appendChild(s);
  });
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// 只支持三种行内格式：`代码`、**加粗**、[文字](链接)
function inline(s) {
  const parts = String(s ?? '').split(/(`[^`]+`)/);
  return parts.map(p => {
    if (/^`[^`]+`$/.test(p)) return '<code>' + esc(p.slice(1, -1)) + '</code>';
    return esc(p)
      .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
      .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  }).join('');
}

function paras(s) {
  return String(s ?? '').split(/\n+/).filter(Boolean).map(p => '<p>' + inline(p) + '</p>').join('');
}

function box(cls, icon, lead, text) {
  if (!text) return '';
  return `<div class="box ${cls}"><b class="lead">${icon} ${lead}</b>${inline(text)}</div>`;
}

function codeBlock(code) {
  return `<div class="code"><button class="copy">复制</button><pre>${esc(code)}</pre></div>`;
}

function renderNewsItem(it, i) {
  const src = (it.sources || []).map(x => `<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.name)} ↗</a>`).join('');
  return `<article class="card" id="item-${i}">
    <h2>${esc(it.emoji || '')} ${i + 1}. ${inline(it.title)}</h2>
    ${paras(it.body)}
    ${box('explain', '📘', '看不懂？先补点背景', it.explain)}
    ${box('opinion', '💡', '我的看法', it.opinion)}
    ${src ? `<div class="sources">🔗 来源：${src}</div>` : ''}
    <div class="askrow"><button class="ask" data-i="${i}">🤖 问 AI 这一条</button></div>
  </article>`;
}

function renderGithubItem(it, i) {
  const meta = [
    it.lang ? `<code>${esc(it.lang)}</code>` : '',
    it.stars ? `⭐ ${esc(it.stars)}` : '',
    it.today ? `今日 +${esc(it.today)}` : '',
    it.week ? `本周 +${esc(it.week)}` : ''
  ].filter(Boolean).join(' · ');
  const install = (it.install || []).map(sec => `
    <div class="install">
      <h3>🧰 ${inline(sec.title)}</h3>
      ${sec.intro ? `<div class="step">${inline(sec.intro)}</div>` : ''}
      ${(sec.steps || []).map((st, k) => `<div class="step">
        <div><b>${'①②③④⑤⑥⑦⑧⑨⑩'[k] || (k + 1) + '.'}</b> ${inline(st.text)}</div>
        ${st.code ? codeBlock(st.code) : ''}
        ${st.after ? '<div>' + inline(st.after) + '</div>' : ''}
      </div>`).join('')}
      ${sec.done ? `<div class="step">✅ <b>装好的标志</b>：${inline(sec.done)}</div>` : ''}
    </div>`).join('');
  const url = it.url || ('https://github.com/' + it.repo);
  return `<article class="card" id="item-${i}">
    <h2>${esc(it.emoji || '')} ${i + 1}. ${esc(it.repo)}：${inline(it.title)}</h2>
    ${meta ? `<div class="meta">${meta}</div>` : ''}
    ${paras(it.body)}
    ${box('explain', '📘', '看不懂？先补点背景', it.explain)}
    ${box('opinion', '💡', '我的看法', it.opinion)}
    ${install}
    <div class="sources">🔗 <a href="${esc(url)}" target="_blank" rel="noopener">GitHub 仓库 ↗</a></div>
    <div class="askrow"><button class="ask" data-i="${i}">🤖 问 AI 这一条</button></div>
  </article>`;
}

function renderDay(d) {
  const items = d.items || [];
  const isGh = cur.type === 'github';
  const toc = items.map((it, i) => `<a href="#" data-i="${i}"><span class="n">${esc(it.emoji || '')}</span><span>${isGh ? esc(it.repo) + '：' : ''}${inline(it.title)}</span></a>`).join('');
  return `
    ${box('hot', '🔥', '今日看点', d.highlight)}
    <nav class="toc">${toc}</nav>
    ${items.map(isGh ? renderGithubItem : renderNewsItem).join('')}
    <div class="foot">${esc(d.note || (isGh
      ? '由 AI 根据 GitHub 热门榜自动整理，「背景」和「看法」是 AI 的解读；星数为抓取时的数据。安装前先看项目 README，别在不了解的程序里填 API key 或私钥。'
      : '由 AI 根据公开报道自动整理，「背景」和「看法」是 AI 的解读，不是新闻原文；数字以原文为准。'))}</div>`;
}

async function show(type, date, push) {
  cur.type = TYPES[type] ? type : 'news';
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.t === cur.type));
  document.getElementById('icon').textContent = TYPES[cur.type].icon;
  const view = document.getElementById('view');
  const list = DAILY_INDEX[cur.type] || [];
  if (!list.length) { view.innerHTML = '<div class="empty">还没有内容</div>'; return; }
  cur.date = list.includes(date) ? date : list[0];

  const sel = document.getElementById('dates');
  sel.innerHTML = list.map(x => `<option value="${x}">${x}${x === list[0] ? '（最新）' : ''}</option>`).join('');
  sel.value = cur.date;
  const idx = list.indexOf(cur.date);
  document.getElementById('prev').disabled = idx >= list.length - 1;
  document.getElementById('next').disabled = idx <= 0;

  const hash = `#${cur.type}/${cur.date}`;
  if (push && location.hash !== hash) history.pushState(null, '', hash);
  document.title = `${cur.date} ${TYPES[cur.type].name} · 每日速递`;

  const key = `${cur.type}/${cur.date}`;
  if (!DAILY_DATA[key]) {
    view.innerHTML = '<div class="empty">加载中…</div>';
    try { await loadScript(`data/${key}.js`); }
    catch (e) { view.innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
  }
  if (`${cur.type}/${cur.date}` !== key) return; // 加载期间又切走了
  view.innerHTML = renderDay(DAILY_DATA[key]);
  window.scrollTo(0, 0);
}

function fromHash() {
  const [t, d] = location.hash.slice(1).split('/');
  return [t || 'news', d];
}

document.querySelectorAll('.tab').forEach(b => b.onclick = () => show(b.dataset.t, null, true));
document.getElementById('dates').onchange = e => show(cur.type, e.target.value, true);

function copyText(text, btn) {
  const old = btn.textContent;
  const done = () => { btn.textContent = '已复制'; setTimeout(() => btn.textContent = old, 1500); };
  if (navigator.clipboard) navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done));
  else fallbackCopy(text, done);
}

function fallbackCopy(text, done) {
  const t = document.createElement('textarea');
  t.value = text;
  document.body.appendChild(t);
  t.select();
  try { document.execCommand('copy'); done(); } catch (e) {}
  t.remove();
}

// ---------- Markdown（AI 的回答用，比数据文件那套完整） ----------
function mdInline(s) {
  return String(s).split(/(`[^`\n]+`)/).map(p => {
    if (/^`[^`]+`$/.test(p)) return '<code>' + esc(p.slice(1, -1)) + '</code>';
    return esc(p)
      .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)|(https?:\/\/[^\s<>()（）「」，。；、]+[^\s<>()（）「」，。；、.,;:!?'"])/g,
        (m, t, u, bare) => bare
          ? `<a href="${bare}" target="_blank" rel="noopener">${bare}</a>`
          : `<a href="${u}" target="_blank" rel="noopener">${t}</a>`)
      .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
      .replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?!\*)/g, '$1<i>$2</i>');
  }).join('');
}

function md(src) {
  const lines = String(src ?? '').replace(/\r/g, '').split('\n');
  const listRe = /^(\s*)([-*+]|\d+[.)])\s+(.*)$/;
  const sepRe = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)*\|?\s*$/;
  const cells = l => l.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
  let html = '', i = 0;
  const para = [];
  const flush = () => { if (para.length) { html += '<p>' + para.map(mdInline).join('<br>') + '</p>'; para.length = 0; } };

  while (i < lines.length) {
    const l = lines[i];
    let m;
    if ((m = l.match(/^\s*(`{3,}|~{3,})/))) {
      flush();
      const buf = [];
      i++;
      while (i < lines.length && !lines[i].trim().startsWith(m[1])) buf.push(lines[i++]);
      i++;
      html += codeBlock(buf.join('\n'));
      continue;
    }
    if (!l.trim()) { flush(); i++; continue; }
    if ((m = l.match(/^\s*#{1,6}\s+(.*)$/))) { flush(); html += '<h4>' + mdInline(m[1].replace(/\s*#+\s*$/, '')) + '</h4>'; i++; continue; }
    if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(l)) { flush(); html += '<hr>'; i++; continue; }
    if (/^\s*>/.test(l)) {
      flush();
      const buf = [];
      while (i < lines.length && /^\s*>/.test(lines[i])) buf.push(lines[i++].replace(/^\s*>\s?/, ''));
      html += '<blockquote>' + md(buf.join('\n')) + '</blockquote>';
      continue;
    }
    if (l.includes('|') && i + 1 < lines.length && sepRe.test(lines[i + 1]) && lines[i + 1].includes('-')) {
      flush();
      const head = cells(l);
      i += 2;
      const rows = [];
      while (i < lines.length && lines[i].includes('|') && lines[i].trim()) rows.push(cells(lines[i++]));
      html += '<div class="tbl"><table><thead><tr>' + head.map(c => '<th>' + mdInline(c) + '</th>').join('') + '</tr></thead><tbody>'
        + rows.map(r => '<tr>' + head.map((_, k) => '<td>' + mdInline(r[k] ?? '') + '</td>').join('') + '</tr>').join('')
        + '</tbody></table></div>';
      continue;
    }
    if ((m = l.match(listRe))) {
      flush();
      const base = m[1].length;
      const ordered = /\d/.test(m[2]);
      const items = [];
      while (i < lines.length) {
        const s = lines[i];
        const mm = s.match(listRe);
        if (mm && mm[1].length <= base + 1) { items.push([mm[3]]); i++; continue; }
        if (s.trim() && /^\s/.test(s) && items.length) { items[items.length - 1].push(s.replace(/^\s{1,4}/, '')); i++; continue; }
        // 空行后面还是列表或缩进内容，就算同一个列表
        if (!s.trim() && i + 1 < lines.length && (listRe.test(lines[i + 1]) || /^\s{2,}\S/.test(lines[i + 1]))
            && (lines[i + 1].match(listRe)?.[1].length ?? 99) >= base) { i++; continue; }
        break;
      }
      const start = ordered ? parseInt(m[2]) : 1;
      html += (ordered ? `<ol${start !== 1 ? ` start="${start}"` : ''}>` : '<ul>')
        + items.map(it => '<li>' + (it.length > 1 ? mdInline(it[0]) + md(it.slice(1).join('\n')) : mdInline(it[0])) + '</li>').join('')
        + (ordered ? '</ol>' : '</ul>');
      continue;
    }
    para.push(l);
    i++;
  }
  flush();
  return html;
}

// ---------- 上下文：把页面数据整理成给模型读的文字 ----------
function fmtItem(type, it, i) {
  const L = [];
  if (type === 'github') {
    L.push(`【第 ${i + 1} 条】${it.repo}：${it.title}`);
    const meta = [it.lang && '语言 ' + it.lang, it.stars && '星数 ' + it.stars, it.today && '今日 +' + it.today, it.week && '本周 +' + it.week].filter(Boolean);
    if (meta.length) L.push(meta.join('，'));
    L.push('仓库：' + (it.url || 'https://github.com/' + it.repo));
  } else {
    L.push(`【第 ${i + 1} 条】${it.title}`);
  }
  L.push('正文：' + it.body);
  if (it.explain) L.push('背景：' + it.explain);
  if (it.opinion) L.push('看法：' + it.opinion);
  (it.install || []).forEach(sec => {
    L.push('〔' + sec.title + '〕');
    if (sec.intro) L.push(sec.intro);
    (sec.steps || []).forEach((st, k) => {
      L.push(`${k + 1}. ${st.text}`);
      if (st.code) L.push('```\n' + st.code + '\n```');
      if (st.after) L.push(st.after);
    });
    if (sec.done) L.push('装好的标志：' + sec.done);
  });
  if (it.sources?.length) L.push('来源：' + it.sources.map(x => `${x.name} ${x.url}`).join('；'));
  return L.join('\n');
}

function fmtDay(type, d) {
  return `## ${d.date} ${TYPES[type].name}\n今日看点：${d.highlight || ''}\n\n` + (d.items || []).map((it, i) => fmtItem(type, it, i)).join('\n\n');
}

async function loadDay(type, date) {
  const key = `${type}/${date}`;
  if (!DAILY_DATA[key]) await loadScript(`data/${key}.js`);
  return DAILY_DATA[key];
}

async function buildContext() {
  if (ai.scope === 'all') {
    const parts = [];
    for (const t of Object.keys(TYPES)) {
      const dates = DAILY_INDEX[t] || [];
      const days = await Promise.all(dates.map(d => loadDay(t, d).catch(() => null)));
      days.forEach(d => d && parts.push(fmtDay(t, d)));
    }
    return parts.join('\n\n');
  }
  // 「这一天」「这一条」都带上当天两个栏目的全部内容：在资讯页打开也能问 GitHub 热门
  const parts = [];
  for (const t of dayTypes()) {
    const d = await loadDay(t, ai.date).catch(() => null);
    if (d) parts.push(fmtDay(t, d));
  }
  if (ai.scope === 'day') return parts.join('\n\n');
  const it = DAILY_DATA[`${ai.type}/${ai.date}`].items[ai.item];
  return `（用户正在问的是：${ai.date} ${TYPES[ai.type].name}第 ${ai.item + 1} 条「${ai.type === 'github' ? it.repo + '：' : ''}${it.title}」，`
    + `回答围绕这一条；当天其他内容供参考）\n\n` + parts.join('\n\n');
}

// 当天有哪些栏目，当前栏目排前面
function dayTypes() {
  return Object.keys(TYPES).filter(t => (DAILY_INDEX[t] || []).includes(ai.date)).sort((a, b) => (b === ai.type) - (a === ai.type));
}

function chatKey() {
  if (ai.scope === 'all') return 'chat.all';
  if (ai.scope === 'day') return `chat.day/${ai.type}/${ai.date}`;
  return `chat.item/${ai.type}/${ai.date}/${ai.item}`;
}

function saveChat() {
  const msgs = ai.msgs.filter(m => !m.pending).slice(-40);
  if (msgs.length) store.set(chatKey(), msgs); else store.del(chatKey());
}

function openAI(item) {
  if (ai.busy) { showPanel(); return; }
  ai.type = cur.type;
  ai.date = cur.date;
  ai.item = Number.isInteger(item) ? item : null;
  if (!ai.date) return;
  ai.scope = ai.item === null ? 'day' : 'item';
  ai.msgs = store.get(chatKey(), []);
  showPanel();
  renderChat();
  if (!store.get('key', '')) showSettings();
}

function ctxLabel() {

  if (ai.scope === 'all') {

    return `📚 全部 ${n('news')} 天 AI 资讯 + ${n('github')} 天 GitHub 热门（内容多，每问一次花费会高一些）`;

  const both = dayTypes().map(t => TYPES[t].name).join(' + ');

  const it = DAILY_DATA[`${ai.type}/${ai.date}`]?.items?.[ai.item];
  return `📌 ${name}第 ${ai.item + 1} 条：${it ? (ai.type === 'github' ? it.repo : it.title) : ''}（也能看到当天的${both}）`;
}

function renderMsgs() {
  const list = $('aiList');
  if (!ai.msgs.length) {
    const noKey = !store.get('key', '');
    list.innerHTML = `<div class="ai-empty">
      ${noKey ? '⚠️ 还没填 OpenRouter API key，<a href="#" data-act="set">点这里去设置</a>。<br>' : ''}
      AI 会读上面范围里的全部内容再回答你。可以直接问，或者点一个：

      }).join('')}</div></div>`;
    return;
  }

  list.scrollTop = list.scrollHeight;

function msgHtml(m, idx) {
  if (m.role === 'user') return `<div class="msg me"><div class="bubble">${esc(m.content)}</div></div>`;
  const last = idx === ai.msgs.length - 1;
  const u = m.usage;
  const meta = [
    m.model ? m.model.split('/').pop() : '',
    u ? `${u.prompt_tokens ?? '?'} + ${u.completion_tokens ?? '?'} tokens` : '',
    u && typeof u.cost === 'number' ? '$' + (u.cost < 0.0001 && u.cost > 0 ? u.cost.toExponential(1) : u.cost.toFixed(4)) : '',
    u?.server_tool_use?.web_search_requests ? `🌐 搜了 ${u.server_tool_use.web_search_requests} 次` : '',
    m.stopped ? '已停止' : '',
    m.finish === 'length' ? '⚠️ 回答太长被截断了' : ''
  ].filter(Boolean).join(' · ');
  const waiting = m.pending && !m.content && !m.reasoning;
  return `<div class="msg bot" data-idx="${idx}">
    ${m.reasoning ? `<details class="think"${m.pending && !m.content ? ' open' : ''}><summary>💭 思考过程</summary><div>${esc(m.reasoning)}</div></details>` : ''}
    <div class="md">${md(m.content)}</div>
    ${waiting ? `<div class="wait">${store.get('web', false) ? '思考中（可能会先联网搜索）' : '思考中'}</div>` : ''}
    ${m.cites?.length ? `<div class="cites">🔗 参考：${m.cites.map(c => `<a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.title || c.url)}</a>`).join('')}</div>` : ''}
    ${m.error ? `<div class="err">⚠️ ${esc(m.error)}</div>` : ''}
    ${m.pending ? '' : `<div class="mfoot"><span class="mmeta">${esc(meta)}</span>
      ${m.content ? `<button class="mbtn" data-act="copy" data-idx="${idx}">复制</button>` : ''}
      ${last ? '<button class="mbtn" data-act="retry">重新回答</button>' : ''}</div>`}
  </div>`;
}

    if (nearBottom) list.scrollTop = list.scrollHeight;
  });
}

// ---------- 请求 ----------
async function* sse(res) {
  const reader = res.body.getReader();
  const dec = new TextDecoder();
  let buf = '';
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    let k;
    while ((k = buf.indexOf('\n')) >= 0) {
      const line = buf.slice(0, k).replace(/\r$/, '');
      buf = buf.slice(k + 1);
      // 以「:」开头的是 OpenRouter 的保活注释，不是 JSON
      if (!line.startsWith('data:')) continue;
      const data = line.slice(5).trim();
      if (data === '[DONE]') return;
      if (!data) continue;
      try { yield JSON.parse(data); } catch (e) {}
    }
  }
}

function errText(status, body) {
  const msg = body?.error?.message || '';
  const raw = msg ? `（原始信息：${msg}）` : '';
  if (status === 401) return 'API key 不对或已被禁用，去 ⚙️ 设置里检查一下' + raw;
  if (status === 402) return 'OpenRouter 余额不够了，或这个 key 的额度上限用完了' + raw;
  if (status === 429) return '请求太频繁（免费模型每天次数有限），过一会儿再试' + raw;
  if (status === 403) return '请求被拦下了（内容审核或 key 权限）' + raw;
  if (status === 404) return (/tool/i.test(msg) ? '这个模型不支持联网工具，关掉「🌐 联网」或换个模型' : '模型不存在或暂时没有可用的服务商，去设置里换一个') + raw;
  if (status === 400 && /tool/i.test(msg)) return '这个模型不支持联网工具，关掉「🌐 联网」或换个模型' + raw;
  if (status >= 500) return 'OpenRouter 或模型服务商出错了，稍后重试' + raw;
  return `请求失败（${status}）` + raw;
}

async function send(text) {
  text = (text ?? '').trim();
  if (!text || ai.busy) return;
  const key = store.get('key', '');
  if (!key) { showSettings(); return; }
  ai.msgs.push({ role: 'user', content: text });
  await answer();
}

async function answer() {
  const key = store.get('key', '');
  const model = modelName();
  const web = store.get('web', false);
  const history = ai.msgs.filter(m => !m.error || m.content).map(m => ({ role: m.role, content: m.content })).slice(-20);
  const msg = { role: 'assistant', content: '', reasoning: '', model, pending: true };
  ai.msgs.push(msg);
  ai.busy = true;
  ai.ctrl = new AbortController();
  renderChat();

  try {
    const ctx = await buildContext();
    const res = await fetch(API + '/chat/completions', {
      method: 'POST',
      signal: ai.ctrl.signal,
      headers: {
        'Authorization': 'Bearer ' + key,
        'Content-Type': 'application/json',
        'HTTP-Referer': location.origin + location.pathname,
        'X-OpenRouter-Title': 'Daily Digest',
        'X-OpenRouter-App-Visibility': 'hidden'
      },
      body: JSON.stringify({
        model,
        stream: true,
        messages: [{ role: 'system', content: systemPrompt(ctx) }, ...history],
        ...(web ? { tools: WEB_TOOLS } : {})
      })
    });
    if (!res.ok) {
      let body = null;
      try { body = await res.json(); } catch (e) {}
      throw new Error(errText(res.status, body));
    }
    for await (const ch of sse(res)) {
      if (ch.error) throw new Error(errText(ch.error.code || 0, ch));
      if (ch.model) msg.model = ch.model;
      if (ch.usage) msg.usage = ch.usage;
      const c = ch.choices?.[0];
      if (c) {
        const d = c.delta || {};
        if (d.reasoning) msg.reasoning += d.reasoning;
        if (d.content) msg.content += d.content;
        const ann = d.annotations || c.message?.annotations;
        if (ann) {
          msg.cites = msg.cites || [];
          for (const a of ann) {
            const uc = a.url_citation || a;
            if (a.type === 'url_citation' && uc.url && !msg.cites.some(x => x.url === uc.url)) msg.cites.push({ url: uc.url, title: uc.title });
          }
        }
        if (c.finish_reason === 'error') throw new Error('生成到一半出错了，可以点「重新回答」');
        if (c.finish_reason) msg.finish = c.finish_reason;
      }
      renderLast();
    }
    if (!msg.content && !msg.reasoning) msg.error = '模型没有返回内容，可以点「重新回答」或换个模型';
  } catch (e) {
    if (e.name === 'AbortError') msg.stopped = true;
    else if (e instanceof TypeError) msg.error = '连不上 openrouter.ai。在国内要先开代理（FlClash），开了再点「重新回答」';
    else msg.error = e.message;
  } finally {
    msg.pending = false;
    if (!msg.reasoning) delete msg.reasoning;
    ai.busy = false;
    ai.ctrl = null;
    saveChat();
    renderChat();
  }
}

function retry() {
  if (ai.busy) return;
  while (ai.msgs.length && ai.msgs[ai.msgs.length - 1].role === 'assistant') ai.msgs.pop();
  if (!ai.msgs.length) { renderChat(); return; }
  answer();
}

// ---------- 设置 ----------
function money(n) { return '$' + (Math.round(n * 100) / 100).toFixed(2); }
function price(m) {
  if (!m?.pricing) return '';
  const p = x => { const v = +x * 1e6; return v === 0 ? '0' : v < 1 ? v.toFixed(2) : v.toFixed(1).replace(/\.0$/, ''); };
  if (+m.pricing.prompt === 0 && +m.pricing.completion === 0) return '免费';
  return `$${p(m.pricing.prompt)} / $${p(m.pricing.completion)}`;
}

async function loadModels() {
  if (ai.models) return ai.models;
  const res = await fetch(API + '/models');
  if (!res.ok) throw new Error('模型列表加载失败（' + res.status + '）');
  ai.models = (await res.json()).data || [];
  return ai.models;
}

function showSettings() {
  $('aiChat').style.display = 'none';
  const box = $('aiSet');
  box.style.display = 'block';
  const key = store.get('key', '');
  box.innerHTML = `
    <h3>① OpenRouter API key</h3>
    ${key ? '' : `<ol>
      <li>打开 <a href="https://openrouter.ai/settings/keys" target="_blank" rel="noopener">openrouter.ai/settings/keys</a>（国内要开代理），登录后点「Create Key」</li>
      <li><b>建议给这个 key 设一个额度上限</b>（比如 $2），万一泄露也亏不了多少</li>
      <li>复制 <code>sk-or-</code> 开头的 key，粘到下面，点保存</li></ol>`}
    <div class="row">
      <input id="setKey" type="password" autocomplete="off" placeholder="sk-or-v1-..." value="${esc(key)}">
      <button class="btn" data-act="eye">显示</button>
    </div>
    <div class="row">
      <button class="btn pri" data-act="savekey">保存</button>
      <button class="btn" data-act="checkkey">查余额</button>
      ${key ? '<button class="btn" data-act="delkey">删除 key</button>' : ''}
    </div>
    <div class="note" id="keyNote"></div>
    <p>key 只保存在这台设备的这个浏览器里，只发给 openrouter.ai，不会上传到网站。别在别人的设备上填。</p>

    <h3>② 模型</h3>
    <p>价格是每百万 token 的「输入 / 输出」美元价。整页内容大约 1 万多 token，所以问一次通常是几厘钱到几分钱。</p>
    <div class="models" id="setPicks">${PICKS.map(id => `<button class="model${id === modelName() ? ' on' : ''}" data-model="${id}"><span>${id}${id === DEFAULT_MODEL ? '（默认）' : ''}</span><small data-price="${id}"></small></button>`).join('')}</div>
    <p style="margin-top:10px">或者填任意模型 ID（输入关键词会提示）：</p>
    <div class="row">
      <input id="setModel" list="modelList" autocomplete="off" placeholder="例如 openai/gpt-5.6-luna" value="${esc(modelName())}">
      <button class="btn" data-act="savemodel">使用</button>
    </div>
    <datalist id="modelList"></datalist>
    <div class="note" id="modelNote"></div>

    <h3>③ 关于我（可选）</h3>
    <p>写上你的情况，AI 会按你的水平和设备来回答。只存在本机。</p>
    <textarea id="setProfile" placeholder="例如：自学开发者，主要用安卓手机 Termux 写代码，在做 AI 应用和 Agent，会一点 JS 和 Python">${esc(store.get('profile', ''))}</textarea>
    <div class="row"><button class="btn" data-act="saveprofile">保存</button></div>
    <div class="note" id="profileNote"></div>

    <div class="row" style="margin-top:22px"><button class="btn pri" data-act="back">← 回到对话</button></div>`;

  loadModels().then(list => {
    const byId = Object.fromEntries(list.map(m => [m.id, m]));
    box.querySelectorAll('[data-price]').forEach(el => {
      const m = byId[el.dataset.price];
      el.textContent = m ? price(m) : '已下架';
    });
    $('modelList') && ($('modelList').innerHTML = list.map(m => `<option value="${esc(m.id)}">${esc(m.name)} · ${price(m)}</option>`).join(''));
    modelHint();
  }).catch(e => { const n = $('modelNote'); if (n) n.textContent = e.message + '（开代理后重新打开设置）'; });
}

function modelHint() {
  const n = $('modelNote');
  if (!n || !ai.models) return;
  const m = ai.models.find(x => x.id === modelName());
  if (!m) { n.textContent = '⚠️ 当前模型 ' + modelName() + ' 在 OpenRouter 上找不到了，换一个吧'; return; }
  const tools = (m.supported_parameters || []).includes('tools');
  n.textContent = `当前：${m.name} · ${price(m)} · 上下文 ${Math.round(m.context_length / 1000)}K${tools ? '' : ' · ⚠️ 不支持联网工具'}`;
}

async function checkKey() {
  const note = $('keyNote');
  const key = $('setKey').value.trim() || store.get('key', '');
  if (!key) { note.textContent = '先填 key'; return; }
  note.textContent = '查询中…';
  try {
    const res = await fetch(API + '/key', { headers: { Authorization: 'Bearer ' + key } });
    const body = await res.json().catch(() => null);
    if (!res.ok) { note.textContent = '❌ ' + errText(res.status, body); return; }
    const d = body.data || {};
    const parts = ['✅ key 有效'];
    if (typeof d.limit === 'number') parts.push(`额度上限 ${money(d.limit)}，还剩 ${money(d.limit_remaining ?? d.limit - d.usage)}`);
    else parts.push('这个 key 没设额度上限');
    if (typeof d.usage === 'number') parts.push(`累计用了 ${money(d.usage)}，今天 ${money(d.usage_daily || 0)}`);
    if (d.is_free_tier) parts.push('账户还没充过值，只能用免费模型');
    note.textContent = parts.join('；');
  } catch (e) {
    note.textContent = '❌ 连不上 openrouter.ai，先开代理';
  }
}

$('aiSet').addEventListener('click', e => {
  const b = e.target.closest('[data-act],[data-model]');
  if (!b) return;
  if (b.dataset.model) {
    store.set('model', b.dataset.model);
    $('setModel').value = b.dataset.model;
    $('aiSet').querySelectorAll('.model').forEach(x => x.classList.toggle('on', x === b));
    $('aiModel').textContent = b.dataset.model;
    modelHint();
    return;
  }
  const act = b.dataset.act;
  if (act === 'eye') { const k = $('setKey'); k.type = k.type === 'password' ? 'text' : 'password'; b.textContent = k.type === 'password' ? '显示' : '隐藏'; }
  if (act === 'savekey') {
    const v = $('setKey').value.trim();
    if (!v) { $('keyNote').textContent = '先填 key'; return; }
    if (!/^sk-or-/.test(v)) { $('keyNote').textContent = '⚠️ OpenRouter 的 key 一般是 sk-or- 开头，确认一下有没有复制错'; }
    store.set('key', v);
    checkKey();
  }
  if (act === 'checkkey') checkKey();
  if (act === 'delkey' && confirm('从这台设备上删掉 key？')) { store.del('key'); showSettings(); }
  if (act === 'savemodel') {
    const v = $('setModel').value.trim();
    if (!v) return;
    store.set('model', v);
    $('aiModel').textContent = v;
    $('aiSet').querySelectorAll('.model').forEach(x => x.classList.toggle('on', x.dataset.model === v));
    modelHint();
    if (ai.models && !ai.models.some(m => m.id === v)) $('modelNote').textContent = '⚠️ OpenRouter 上没有叫 ' + v + ' 的模型，检查一下拼写';
  }
  if (act === 'saveprofile') { store.set('profile', $('setProfile').value.trim()); $('profileNote').textContent = '✅ 已保存'; }
  if (act === 'back') renderChat();
});

// ---------- 事件 ----------
$('aifab').onclick = () => openAI(null);
$('aiClose').onclick = () => closeAI();
$('ai').addEventListener('click', e => { if (e.target === $('ai')) closeAI(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('ai').classList.contains('open')) closeAI(); });
$('aiSetBtn').onclick = () => $('aiSet').style.display === 'none' ? showSettings() : renderChat();
$('aiModel').onclick = showSettings;
$('aiScope').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setScope(b.dataset.s); });
$('aiNew').onclick = () => {
  if (ai.busy || !ai.msgs.length) return;
  if (!confirm('清空这个范围的对话记录？')) return;
  ai.msgs = [];
  saveChat();
  renderChat();
};
$('aiWeb').onclick = () => {
  store.set('web', !store.get('web', false));
  $('aiWeb').classList.toggle('on', store.get('web', false));
};

const input = $('aiText');
function autosize() { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight + 2, 140) + 'px'; }
input.addEventListener('input', autosize);
input.addEventListener('keydown', e => {
  // 电脑上 Enter 发送、Shift+Enter 换行；手机键盘的回车就是换行
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && !matchMedia('(pointer: coarse)').matches) {
    e.preventDefault();
    $('aiSend').click();
  }
});
$('aiSend').onclick = () => {
  if (ai.busy) { ai.ctrl?.abort(); return; }
  const t = input.value;
  if (!t.trim()) return;
  input.value = '';
  autosize();
  send(t);
};

$('aiList').addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if (chip) {
    if (chip.dataset.web && !store.get('web', false)) { store.set('web', true); $('aiWeb').classList.add('on'); }
    send(chip.dataset.q);
    return;
  }
  const b = e.target.closest('[data-act]');
  if (b) {
    e.preventDefault();
    if (b.dataset.act === 'set') showSettings();
    if (b.dataset.act === 'retry') retry();
    if (b.dataset.act === 'copy') copyText(ai.msgs[+b.dataset.idx].content, b);
    return;
  }
  const c = e.target.closest('.copy');
  if (c) copyText(c.nextElementSibling.textContent, c);
});

Promise.allSettled(Object.keys(TYPES).map(t => loadScript(`data/${t}/index.js?v=${VER}`)))
  .then(() => show(...fromHash(), false));
</script>
